version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: qassure-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://qassure:qassure_password@postgres:5432/qassure
      - REDIS_URL=redis://:redis_password@redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-min-32-chars
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key-32-chars
      - APP_URL=https://qasure.tech4bizsolutions.com/
      - EMAIL_FROM=noreply@qassure.ai
      - CORS_ORIGIN=http://localhost:5173,https://qasure.tech4bizsolutions.com
      - CORS_CREDENTIALS=true
      - KAFKA_BROKERS=kafka:9092
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # ===========================================
      # AI Gateway (set at least ONE provider)
      # ===========================================
      # Direct mode
      - OPENAI_API_KEY=
      - ANTHROPIC_API_KEY=
      # Azure OpenAI mode (OpenAIProvider)
      - AZURE_OPENAI_ENDPOINT=
      - AZURE_OPENAI_API_KEY=
      - AZURE_OPENAI_DEPLOYMENT=
      - AZURE_OPENAI_API_VERSION=2024-12-01-preview
      # Azure AI Foundry (AnthropicProvider)
      - AZURE_ANTHROPIC_ENDPOINT=
      - AZURE_AI_API_KEY=
      - AZURE_ANTHROPIC_DEPLOYMENT=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qassure-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: qassure-postgres
    environment:
      - POSTGRES_USER=qassure
      - POSTGRES_PASSWORD=qassure_password
      - POSTGRES_DB=qassure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qassure"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qassure-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: qassure-redis
    command: redis-server --requirepass redis_password --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qassure-network
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.6
    container_name: qassure-kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    volumes:
      - kafka_data:/bitnami/kafka
    ports:
      - "9092:9092"
    networks:
      - qassure-network
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: qassure-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - qassure-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  elasticsearch_data:

networks:
  qassure-network:
    driver: bridge
