apiVersion: v1
kind: Service
metadata:
  name: qassure-api-service
  namespace: qassure
  labels:
    app.kubernetes.io/name: qassure
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: qassure-api
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: qassure
  labels:
    app.kubernetes.io/name: qassure
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: qassure
  labels:
    app.kubernetes.io/name: qassure
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: qassure
  labels:
    app.kubernetes.io/name: qassure
    app.kubernetes.io/component: elasticsearch
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: 9200
  selector:
    app: elasticsearch
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: qassure
  labels:
    app.kubernetes.io/name: qassure
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
  selector:
    app: kafka
