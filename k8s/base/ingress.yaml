apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qassure-ingress
  namespace: qassure
  labels:
    app.kubernetes.io/name: qassure
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "qassure-api-service"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.qassure.ai"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Tenant-ID, X-Correlation-ID"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.qassure.ai
      secretName: qassure-tls-secret
  rules:
    - host: api.qassure.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qassure-api-service
                port:
                  number: 3000
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: qassure-tls
  namespace: qassure
spec:
  secretName: qassure-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - api.qassure.ai
    - app.qassure.ai
