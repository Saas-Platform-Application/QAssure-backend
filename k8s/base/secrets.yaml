apiVersion: v1
kind: Secret
metadata:
  name: qassure-secrets
  namespace: qassure
  labels:
    app.kubernetes.io/name: qassure
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials (replace with actual values)
  DB_USERNAME: "qassure_admin"
  DB_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"
  DATABASE_URL: "postgresql://qassure_admin:REPLACE_WITH_SECURE_PASSWORD@postgres-service:5432/qassure_prod?sslmode=require"
  
  # JWT secrets (generate secure random strings)
  JWT_SECRET: "REPLACE_WITH_MIN_32_CHAR_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_MIN_32_CHAR_REFRESH_SECRET"
  
  # Redis password
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"
  REDIS_URL: "redis://:REPLACE_WITH_REDIS_PASSWORD@redis-service:6379"
  
  # AI Provider Keys
  OPENAI_API_KEY: "REPLACE_WITH_OPENAI_KEY"
  ANTHROPIC_API_KEY: "REPLACE_WITH_ANTHROPIC_KEY"
  # Azure OpenAI (optional alternative to direct key)
  AZURE_OPENAI_ENDPOINT: "REPLACE_WITH_AZURE_OPENAI_ENDPOINT"
  AZURE_OPENAI_API_KEY: "REPLACE_WITH_AZURE_OPENAI_API_KEY"
  AZURE_OPENAI_DEPLOYMENT: "REPLACE_WITH_AZURE_OPENAI_DEPLOYMENT"
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  # Azure AI Foundry for Anthropic (optional alternative to direct key)
  AZURE_ANTHROPIC_ENDPOINT: "REPLACE_WITH_AZURE_ANTHROPIC_ENDPOINT"
  AZURE_AI_API_KEY: "REPLACE_WITH_AZURE_AI_API_KEY"
  AZURE_ANTHROPIC_DEPLOYMENT: "REPLACE_WITH_AZURE_ANTHROPIC_DEPLOYMENT"
  
  # Email configuration
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  SMTP_PASSWORD: "REPLACE_WITH_SENDGRID_API_KEY"
  
  # Elasticsearch credentials
  ELASTICSEARCH_USERNAME: "elastic"
  ELASTICSEARCH_PASSWORD: "REPLACE_WITH_ES_PASSWORD"
