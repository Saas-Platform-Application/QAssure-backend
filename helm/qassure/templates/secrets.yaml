apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qassure.fullname" . }}-secrets
  labels:
    {{- include "qassure.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.secrets.dbPassword }}@{{ include "qassure.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=require"
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  REDIS_URL: "redis://:{{ .Values.secrets.redisPassword }}@{{ include "qassure.fullname" . }}-redis-master:6379"
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.azureOpenaiEndpoint }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.secrets.azureOpenaiEndpoint | quote }}
  {{- end }}
  {{- if .Values.secrets.azureOpenaiApiKey }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.azureOpenaiDeployment }}
  AZURE_OPENAI_DEPLOYMENT: {{ .Values.secrets.azureOpenaiDeployment | quote }}
  {{- end }}
  {{- if .Values.secrets.azureOpenaiApiVersion }}
  AZURE_OPENAI_API_VERSION: {{ .Values.secrets.azureOpenaiApiVersion | quote }}
  {{- end }}
  {{- if .Values.secrets.azureAnthropicEndpoint }}
  AZURE_ANTHROPIC_ENDPOINT: {{ .Values.secrets.azureAnthropicEndpoint | quote }}
  {{- end }}
  {{- if .Values.secrets.azureAiApiKey }}
  AZURE_AI_API_KEY: {{ .Values.secrets.azureAiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.azureAnthropicDeployment }}
  AZURE_ANTHROPIC_DEPLOYMENT: {{ .Values.secrets.azureAnthropicDeployment | quote }}
  {{- end }}
