# QAssure Platform Helm Values
global:
  environment: production
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: standard

# API Configuration
api:
  replicaCount: 3
  image:
    repository: qassure/api
    tag: "1.0.0"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env:
    NODE_ENV: production
    PORT: "3000"
    LOG_LEVEL: info
    LOG_FORMAT: json
  livenessProbe:
    httpGet:
      path: /api/v1/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/v1/health/detailed
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.qassure.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: qassure-tls-secret
      hosts:
        - api.qassure.ai

# Secrets
secrets:
  jwtSecret: "REPLACE_ME_WITH_SECURE_SECRET_MIN_32_CHARS"
  jwtRefreshSecret: "REPLACE_ME_WITH_SECURE_REFRESH_SECRET"
  dbPassword: "REPLACE_ME_WITH_SECURE_DB_PASSWORD"
  redisPassword: "REPLACE_ME_WITH_SECURE_REDIS_PASSWORD"
  openaiApiKey: ""
  anthropicApiKey: ""
  # Azure OpenAI (optional alternative to direct key)
  azureOpenaiEndpoint: ""
  azureOpenaiApiKey: ""
  azureOpenaiDeployment: ""
  azureOpenaiApiVersion: "2024-12-01-preview"
  # Azure AI Foundry for Anthropic (optional alternative to direct key)
  azureAnthropicEndpoint: ""
  azureAiApiKey: ""
  azureAnthropicDeployment: ""

# PostgreSQL
postgresql:
  enabled: true
  auth:
    database: qassure_prod
    username: qassure_admin
    existingSecret: qassure-secrets
    secretKeys:
      adminPasswordKey: DB_PASSWORD
  primary:
    persistence:
      enabled: true
      size: 50Gi
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "4Gi"

# Redis
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: qassure-secrets
    existingSecretPasswordKey: REDIS_PASSWORD
  master:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# Kafka
kafka:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
    size: 50Gi
  zookeeper:
    enabled: true
    replicaCount: 3

# Elasticsearch
elasticsearch:
  enabled: true
  master:
    replicaCount: 1
    persistence:
      enabled: true
      size: 30Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"

# Monitoring
monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s

# Persistence
persistence:
  uploads:
    enabled: true
    size: 100Gi
    storageClass: standard
    accessMode: ReadWriteMany

# Network Policies
networkPolicy:
  enabled: true

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Service Account
serviceAccount:
  create: true
  name: qassure-api
  annotations: {}
